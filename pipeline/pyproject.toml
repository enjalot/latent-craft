[project]
name = "lsvoxel"
version = "0.1.0"
description = "Data pipeline for the voxel-UMAP explorer: points tables, chunk packs, minimap packs"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "pillow>=10.0",
  "fsspec>=2024.6",
  "huggingface_hub>=0.24",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lsvoxel = "lsvoxel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lsvoxel"]
