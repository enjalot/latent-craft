[project]
name = "lsvoxel"
version = "0.1.0"
description = "Data pipeline for the voxel-UMAP explorer: points tables, chunk packs, minimap packs"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "pillow>=10.0",
  "fsspec>=2024.6",
  "huggingface_hub>=0.24",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
search = ["torch>=2.6", "transformers>=5.14,<6", "faiss-cpu>=1.13,<2"]
bl-search = ["torch>=2.8", "transformers==5.14.0", "faiss-cpu==1.13.2", "lancedb==0.37.1", "fastapi==0.135.1", "uvicorn==0.41.0"]

[project.scripts]
lsvoxel = "lsvoxel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lsvoxel"]
